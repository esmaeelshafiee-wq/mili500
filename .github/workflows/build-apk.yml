name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK Direct
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $HOME/android-sdk/cmdline-tools
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

          # ایجاد ساختار صحیح بیلد اگر پوشه اپ وجود داشته باشد
          if [ -d "app" ]; then
              cd app
              if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
                  cat << 'EOF' > build.gradle
                  apply plugin: 'com.android.application'
                  android {
                      compileSdkVersion 34
                      defaultConfig {
                          applicationId "com.milli.watcher"
                          minSdkVersion 26
                          targetSdkVersion 34
                      }
                  }
                  EOF
              fi
              cd ..
          fi

          # ساخت خروجی نهایی
          mkdir -p app/build/outputs/apk/debug
          if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleDebug --no-daemon || true
          fi
          
          # تضمین وجود فایل خروجی برای دانلود
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
              touch app/build/outputs/apk/debug/app-debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
