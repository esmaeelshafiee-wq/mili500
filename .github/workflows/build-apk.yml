name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Android Command Line Tools
        run: |
          mkdir -p $HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $HOME/cmdline-tools
          mkdir -p $HOME/Android/Sdk/cmdline-tools/latest
          mv $HOME/cmdline-tools/cmdline-tools/* $HOME/Android/Sdk/cmdline-tools/latest/
          yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/Android/Sdk --licenses

      - name: Build APK using Gradle Direct
        run: |
          cd app
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.milli.watcher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.milli.watcher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "0.4"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("org.jetbrains.kotlin:kotlin-stdlib:2.0.21")
          }
          EOF
          
          # ساخت فایل تنظیمات پروژه برای کامپایل مستقیم
          cd ..
          cat << 'EOF' > build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF
          
          # کامپوننت‌های ساخت
          export ANDROID_HOME=$HOME/Android/Sdk
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0"
          
          # تولید گریدل موقت و ساخت APK
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
